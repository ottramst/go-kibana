# Library release workflow: Go modules are served from the git tag, so a
# release only needs the GitHub release notes and a warm module proxy.
name: Release

# Creates a GitHub release when a tag that matches the pattern "v*"
# (e.g. v0.1.0) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deployment protection rules on the environment restrict releases to v* tags.
    environment: release
    permissions:
      # Creating the GitHub release
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release notes are the CHANGELOG.md section for this version.
          awk -v heading="## $TAG" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $TAG' section."
            exit 1
          fi
          # Re-runs keep the existing release, and any edits made to it.
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> /dev/null); then
            echo "::notice::The $TAG release already exists; not changing it."
            if [ "$draft" = true ]; then
              echo "::warning::The $TAG release is a draft; publish it on GitHub."
            fi
            exit 0
          fi
          case "$TAG" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file notes.md --prerelease="$prerelease"

  # pkg.go.dev picks up the version from proxy.golang.org. The proxy caches a
  # miss for up to about 30 minutes, so the first request waits for the tag to
  # be visible, and later ones retry for longer than that. The release is
  # already published here, so a miss is only a warning.
  warm-proxy:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    steps:
      - name: Warm the Go module proxy
        env:
          TAG: ${{ github.ref_name }}
        run: |
          url="https://proxy.golang.org/github.com/${GITHUB_REPOSITORY,,}/@v/${TAG}.info"
          # About 40 minutes in total, within the job timeout.
          sleep 90
          for attempt in $(seq 1 38); do
            if curl -sS --max-time 20 --fail-with-body "$url"; then
              exit 0
            fi
            echo "Attempt $attempt: $TAG is not on the proxy yet."
            if [ "$attempt" -lt 38 ]; then
              sleep 60
            fi
          done
          echo "::warning::proxy.golang.org does not serve $TAG yet; it will fetch it on first use."
