name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The two supported Go releases. The oldest one is the go directive in
        # go.mod; when a new Go release ships, drop the oldest and bump go.mod.
        go-version:
          - '1.26.x'
          - '1.27.x'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --compact-summary --exit-code -- go.mod go.sum || \
            (echo; echo "go.mod/go.sum are not tidy. Run 'go mod tidy' and commit."; exit 1)
      - run: make build
      - run: go vet ./...
      - name: Unit tests
        run: go test -race -cover -timeout=120s -parallel=10 ./...
